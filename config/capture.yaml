# Phase 1C local-development defaults. The Python MVP accepts equivalent CLI options;
# no YAML runtime dependency is introduced at this milestone.
source:
  source_id: foresight-phone
  transport: rtsp
  uri: rtsp://LAPTOP_LAN_IP:8555/foresight-phone
  video_source: phone_rear_camera
  audio_source: phone_microphone
buffer:
  retention_seconds: 60
  segment_seconds: 2
events:
  pre_seconds: 30
  post_seconds: 15
ffmpeg:
  executable: ffmpeg
telemetry:
  host: 0.0.0.0
  port: 8766
  protocol: http_json_bind_then_batch
  bounded_source_queue_records: 2048
